name: Corregir ubicaciones

on:
  workflow_dispatch:
  push:
    paths:
      - cafes.js

permissions:
  contents: write

jobs:
  ubicaciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar coordenadas en OpenStreetMap
        run: node scripts/ubicaciones.mjs
      - name: Guardar cambios
        run: |
          if git diff --quiet cafes.js; then
            echo "Nada para actualizar"
          else
            git config user.name "filtro-bot"
            git config user.email "filtro-bot@users.noreply.github.com"
            git add cafes.js
            git commit -m "Corregir ubicaciones de cafés"
            git push
          fi
